name: ko-scan2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan screen text
        run: python3 tools/ko_scan2.py
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name battledrones-ko
          git config user.email ko@example.invalid
          git add -A ko-report
          git commit -q -m "chore(ko): grouped string report"
          git push
